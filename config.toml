# Main configuration for the MailTag application.

[logging]
# The logging level. Can be DEBUG, INFO, WARNING, ERROR, CRITICAL.
level = "INFO"

# The file to write logs to.
file = "logs/mailtag.log"

[imap]
host = "mail.infomaniak.com"
user = "${IMAP_USER}"
password = "${IMAP_PASSWORD}"

[gmail]
# Gmail through the API (docs/superpowers/specs/2026-09-28-gmail-api-taxonomy-design.md).
# OAuth desktop client: secrets/credentials.json + secrets/token.json (first run opens the browser).
credentials_file = "secrets/credentials.json"
token_file = "secrets/token.json"
# This account's own pending-archive file and junk label (the Gmail sweep never treats Infomaniak's mail as orphans).
pending_archive_file = "db/pending_archive_gmail.json"
junk_folder_name = "SPAM"

[fast_parse]
# The number of emails to fetch in the first pass.
batch_size = 500
junk_folder_name = "Spam"

# Performance metrics configuration
# Whether to enable metrics collection
metrics_enabled = true
# Log level for metrics reporting (DEBUG, INFO, WARNING, ERROR)
metrics_log_level = "INFO"
# How often to log metrics summary (in minutes)
metrics_log_interval_minutes = 10

[mlx]
# MLX-based classification (Apple Silicon optimized)
# Set to false to use legacy litellm/Ollama instead
enabled = true

# Semantic Router (Signal 5) - embedding-based instant classification
# Model for generating embeddings (nomic supports French and long context)
embedding_model = "nomic-ai/nomic-embed-text-v1.5"
# Minimum similarity score to accept semantic classification (0.0-1.0)
score_threshold = 0.75
# Pre-computed category embeddings file
embeddings_file = "data/category_embeddings.npz"

# LLM Fallback (Signal 6) - text generation when semantic routing fails
# MLX-compatible model from mlx-community
# llm_model = "mlx-community/Mistral-7B-Instruct-v0.3-4bit"
llm_model = "mlx-community/gemma-4-e4b-it-OptiQ-4bit"
# Confidence threshold for LLM classification
llm_confidence = 0.85
# Maximum tokens to generate
llm_max_tokens = 128
# Temperature for generation (lower = more deterministic)
llm_temperature = 0.2

[taxonomy]
# 19-category taxonomy + action folders (spec docs/superpowers/specs/2026-09-27-*)
# nomic alone must be very sure; below, nomic and Gemma must agree, else 5-A revoir
nomic_threshold = 0.90
llm_batch_size = 8
archive_after_days = 7
# Learned rules and centroids (docs/superpowers/specs/2026-09-28-taxonomie-signaux-design.md)
taxonomy_db_dir = "db/taxonomy"
centroids_file = "data/taxonomy_centroids.npz"
learn_min_agreements = 2   # nomic+Gemma agreements before a sender becomes a rule
domain_min_purity = 0.90   # share of a domain's mails in one category to make a domain rule
sender_min_mails = 2       # mails needed before a folder/Gemma agreement becomes a sender rule
# The owner's addresses: never a sender rule, never learned, skipped by `scan`
own_addresses = [
  "fred.jacquet@gmail.com",
  "fred@ljf.ch",
  "fjacquet@ljfch.onmicrosoft.com",
  "frederic.jacquet@me.com",
  "fjacquet@protonmail.ch",
  "frederic.jacquet@epost.ch",
  "frederic.jacquet@sword-group.com",
  "frederic.jacquet@dell.com",
  "frederic.jacquet@tebicom.ch",
  "fjacquet@vaudoise.ch",
  "fjacquet@hotela.ch",
]

[webhook]
# API server settings
host = "127.0.0.1"
port = 8000
# API key for authentication (set WEBHOOK_API_KEY in .env)
api_key = "${WEBHOOK_API_KEY}"
# Enable/disable move operations via API (safety control)
allow_move = true
# Maximum batch size for classify-batch endpoint
max_batch_size = 50
